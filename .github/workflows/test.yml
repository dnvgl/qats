# This workflow will lint, run unit tests, test CLI and build on all supported Python versions and operating systems
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Test Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  #----------------------------------------------
  # linting
  #----------------------------------------------
  linting:
    name: Linting
    # linting has nothing to do with multiple versions of os and python
    # (the result will be the same) and therefore separated to save time
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv and python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - name: Lint code
        run: |
          uv run --locked --only-group dev flake8 ./qats/ --exit-zero --max-complexity=10 --statistics
          uv run --locked --only-group dev black .
          uv run --locked --only-group dev isort .

  #----------------------------------------------
  # test using a matrix
  #----------------------------------------------
  testing:
    needs: linting
    name: Test with Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_API: pyside6
    defaults:
      run:
        shell: bash
    steps:
      # https://stackoverflow.com/questions/75549995/why-do-the-pyside6-qt-modules-cause-tox-to-fail-during-a-github-action
    - name: Install missing libraries on GitHub agent
      if: runner.os == 'Linux'
      run: sudo apt update && sudo apt install -y libegl1-mesa-dev
    #----------------------------------------------
    # check-out repo (with tags, for setuptools-scm) and set up uv and python
    #----------------------------------------------
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up uv and python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
    #----------------------------------------------
    # install project and locked dependencies (fails if uv.lock is out of date)
    #----------------------------------------------
    - name: Install project
      run: uv sync --locked
    #----------------------------------------------
    # run tests
    #----------------------------------------------
    - name: Run unit tests
      run: uv run pytest test/
    - name: Test CLI
      run: |
        uv run qats -h
        uv run qats app -h
        uv run qats config -h
        uv run python -m qats -h
    #----------------------------------------------
    # build and check that the wheel installs and runs in a clean environment
    # (dependencies resolved from PyPI as for `pip install qats`, not from uv.lock)
    #----------------------------------------------
    - name: Test building package
      run: uv build
    - name: Test installing built wheel
      run: |
        wheel=$(ls "$GITHUB_WORKSPACE"/dist/qats-*.whl)
        cd "$RUNNER_TEMP"
        uv run --isolated --no-project --with "$wheel" qats -h
        uv run --isolated --no-project --with "$wheel" python -c "import qats; print(qats.__version__)"
    - name: Test building documentation
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
      run: uv run sphinx-build -b html docs/source docs/_build
    #----------------------------------------------
    # upload artifacts
    # (only done for one combination, the wheel is pure python)
    #----------------------------------------------
    - name: Upload artifacts
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
      uses: actions/upload-artifact@v7
      with:
        name: test-builds
        path: |
          dist/qats-*.tar.gz
          dist/qats-*.whl
