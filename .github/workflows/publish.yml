# This workflow builds the package and publishes it with PyPI trusted publishing (no API token):
# - a published GitHub release is uploaded to PyPI and its builds are attached to the release
# - a manual run ("Run workflow") uploads a development version to TestPyPI, to test the publishing setup
# references:
#   https://docs.astral.sh/uv/guides/package/#publishing-your-package
#   https://docs.pypi.org/trusted-publishers/

name: Publish Python Package to PyPi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
    - name: Install missing libraries on GitHub agent
      run: sudo apt update && sudo apt install -y libegl1-mesa-dev
    - name: Check out repository
      # full history and tags, required by setuptools-scm to derive the version
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up uv and python
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.11"
    - name: Leave out the local version part for TestPyPI
      # TestPyPI (like PyPI) rejects local versions such as 5.4.1.dev3+g1234abc; upload 5.4.1.dev3 instead
      if: github.event_name == 'workflow_dispatch'
      run: echo 'SETUPTOOLS_SCM_OVERRIDES_FOR_QATS={local_scheme = "no-local-version"}' >> "$GITHUB_ENV"
    - name: Build package
      run: uv build
    - name: Check package version matches release tag
      if: github.event_name == 'release'
      run: |
        version="${GITHUB_REF_NAME#v}"
        ls dist/
        test -f "dist/qats-${version}-py3-none-any.whl" || { echo "::error::Built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
    - name: Test installing built wheel
      env:
        QT_API: pyside6
      run: |
        wheel=$(ls "$GITHUB_WORKSPACE"/dist/qats-*.whl)
        cd "$RUNNER_TEMP"
        uv run --isolated --no-project --with "$wheel" qats -h
    - name: Upload builds
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: builds
        path: |
          dist/qats-*.tar.gz
          dist/qats-*.whl

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qats/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
    - name: Download builds
      uses: actions/download-artifact@v8
      with:
        name: builds
        path: dist
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: false
    - name: Publish to PyPI
      run: uv publish --trusted-publishing always

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/qats/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
    - name: Download builds
      uses: actions/download-artifact@v8
      with:
        name: builds
        path: dist
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: false
    - name: Publish to TestPyPI
      # --check-url skips files that are already on TestPyPI (e.g. when re-running for the same commit)
      run: >-
        uv publish --trusted-publishing always
        --publish-url https://test.pypi.org/legacy/
        --check-url https://test.pypi.org/simple/

  release-assets:
    name: Attach builds to the GitHub release
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload builds to the release
    steps:
    - name: Download builds
      uses: actions/download-artifact@v8
      with:
        name: builds
        path: dist
    - name: Upload builds to release
      # https://github.com/softprops/action-gh-release#%EF%B8%8F-uploading-release-assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/qats-*.tar.gz
          dist/qats-*.whl
