# This workflow will upload new releases to PyPi
# reference: https://docs.astral.sh/uv/guides/package/#publishing-your-package

name: Publish Python Package to PyPi

on:
  release:
    types: [published]

jobs:
  publishing:
    name: Build and publish package on PyPi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to upload builds to the release

    steps:
    - name: Install missing libraries on GitHub agent
      run: sudo apt update && sudo apt install -y libegl1-mesa-dev
    - name: Check out repository
      # full history and tags, required by setuptools-scm to derive the version
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up uv and python
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.11"
    - name: Build package
      run: uv build
    - name: Check package version matches release tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        ls dist/
        test -f "dist/qats-${version}-py3-none-any.whl" || { echo "::error::Built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
    - name: Test installing built wheel
      env:
        QT_API: pyside6
      run: |
        wheel=$(ls "$GITHUB_WORKSPACE"/dist/qats-*.whl)
        cd "$RUNNER_TEMP"
        uv run --isolated --no-project --with "$wheel" qats -h
    - name: Publish to pypi
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    - name: Upload artifacts
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: builds
        path: |
          dist/qats-*.tar.gz
          dist/qats-*.whl
    - name: Upload builds to release
      # https://github.com/softprops/action-gh-release#%EF%B8%8F-uploading-release-assets
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/qats-*.tar.gz
          dist/qats-*.whl
