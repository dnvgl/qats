# .readthedocs.yaml
# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

# Dependencies are installed with uv (`uv sync`), including the 'docs' dependency group from pyproject.toml
# https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv

version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  apt_packages:
    # required by PySide6, which is imported when autodoc imports qats.cli
    - libegl1

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
