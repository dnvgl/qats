[pytest]
filterwarnings =
    ; nptdms sets the dtype of an array, which NumPy 2.5 deprecates (about 25,000 warnings from test_readers.py).
    ; Remove this filter when a fixed nptdms is released: https://github.com/adamreeve/npTDMS/issues/371 (qats #177)
    ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:nptdms.base_segment
