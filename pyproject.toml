# pyproject.toml
# https://setuptools.pypa.io/en/latest/userguide/quickstart.html
# https://github.com/pypa/setuptools_scm#setuptools_scm

[project]
name = "qats"
description = "Library for efficient processing and visualization of time series"
authors = [
    { name = "Per Voie", email = "per.voie@gmail.com" },
    { name = "Erling Lone", email = "erling.lone@gmail.com" },
]
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
license.file = "LICENSE"
dependencies = [
    "h5py>=3.11.0",
    "matplotlib>=3.7.5",
    "nptdms>=1.10.0",
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "pymatreader>=0.0.32",
    "pyside6>=6.10.1",
    "pywin32>=311 ; sys_platform == 'win32'",
    "qtpy>=2.4.2",
    "scipy>=1.10.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",   # check against LICENSE
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.16.10",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.1.2",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[project.urls]
Homepage = "https://github.com/dnvgl/qats"
Repository = "https://github.com/dnvgl/qats"
Documentation = "https://qats.readthedocs.io"
Download = "https://pypi.org/project/qats/"
Issues = "https://github.com/dnvgl/qats/issues"
Changelog = "https://github.com/dnvgl/qats/releases"

[project.scripts]
qats = "qats.cli:main"

[tool.setuptools.packages.find]
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#setuptools-specific-configuration
where = ["."]  # ["."] by default
include = ["*"]  # ["*"] by default
# exclude doesn't seem to take effect with `uv build` (or python -m build), and these 
# folders are still included. 
# a manifest file (MANIFEST.in) is therefore used in addition, as a workaround for current limitations in pyproject.toml
#   (ref. e.g. https://github.com/pypa/setuptools/issues/3341)
exclude = [
    "docs*",
    "data*",
    "test*", 
]  # empty by default

[tool.setuptools_scm]
# a version file can be written by setuptools_scm if specified
version_file = "qats/_version.py"

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
line-length = 120
force-exclude = true  # also respect excludes for files passed explicitly (editors, pre-commit)
extend-exclude = [
    "CHANGELOG.md",  # frozen; release notes are in GitHub Releases
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "S",  # flake8-bandit (security)
]
ignore = [
    "S101",  # assert is used for input validation in the library; to be replaced, see #148
]

[build-system]
requires = [
  "setuptools>=64", 
  "setuptools_scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

